<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Director's Movie Club - Candidate Verification</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="https://pyscript.net/releases/2024.3.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2024.3.1/core.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@1,6..96,700;1,6..96,800&family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;1,800;1,900&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #000000;
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
            width: 100vw;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .cinema-viewport {
            width: 100vw;
            max-width: 100%;
            aspect-ratio: 2.0 / 1;
            
            background-image: url('bgblade.jpg');
            background-repeat: no-repeat;
            background-size: cover;
            background-position: 50% 45%;
            
            border-top: 32px solid #000000;
            border-bottom: 32px solid #000000;
            
            position: relative;
            padding: 30px 5%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            overflow: hidden;
        }

        .cinema-viewport::before {
            content: "";
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 50% 50%, rgba(0, 0, 0, 0.0), rgba(0, 0, 0, 0.25));
            pointer-events: none;
        }

        .result-box {
            position: absolute;
            top: 35px;
            right: 4%;
            z-index: 20;
            background: #181a1d;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-left: 5px solid #dfc3b2;
            border-radius: 10px;
            padding: 14px 28px;
            color: #ffffff;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.92rem;
            font-weight: 600;
            letter-spacing: 0.3px;
            line-height: 1.3;
            text-align: center;
            min-width: 320px;
            max-width: 620px;
            white-space: nowrap;
            box-shadow: none !important;
            -webkit-box-shadow: none !important;
            text-shadow: none !important;
            filter: none !important;
            -webkit-filter: none !important;
            backdrop-filter: none !important;
            -webkit-backdrop-filter: none !important;
            display: none;
        }

        .result-box:not(:empty) {
            display: block;
        }

        .card-frame {
            border: 2px solid #ffffff;
            border-radius: 18px; 
            padding: 42px 38px;
            width: 100%;
            max-width: 450px;
            background: rgba(0, 0, 0, 0.12);
            backdrop-filter: blur(2px);
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
        }

        .logo-box {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            margin-bottom: 32px;
            user-select: none;
            padding-left: 4px;
        }

        .text-directors {
            font-family: 'Montserrat', sans-serif;
            font-weight: 800;
            font-style: italic;
            font-size: 2.5rem;
            color: #ffffff;
            letter-spacing: -0.5px;
            line-height: 1.0;
            transform: rotate(-3deg);
            margin-bottom: 12px;
            margin-left: 2px;
        }

        .text-club {
            font-family: 'Bodoni Moda', serif;
            font-style: italic;
            font-weight: 700;
            font-size: 3.1rem;
            color: #ffffff;
            line-height: 1.0;
            white-space: nowrap;
            margin-left: 22px;
        }

        .form-group {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .input-line {
            background-color: transparent !important;
            background: transparent !important;
            border: none !important;
            border-bottom: 2px solid #dfc3b2 !important;
            border-radius: 0 !important;
            padding: 10px 14px;
            color: #ffffff !important;
            font-weight: 600;
            font-size: 1.05rem;
            width: 100%;
            text-align: center;
            box-shadow: none !important;
            outline: none !important;
        }

        .input-line::placeholder {
            color: rgba(255, 255, 255, 0.75);
            font-weight: 500;
        }

        .input-line:focus,
        .input-line:active,
        .input-line:hover {
            outline: none !important;
            box-shadow: none !important;
            border-bottom-color: #ffffff !important;
            background-color: transparent !important;
            background: transparent !important;
        }

        .input-line:-webkit-autofill,
        .input-line:-webkit-autofill:hover, 
        .input-line:-webkit-autofill:focus, 
        .input-line:-webkit-autofill:active {
            -webkit-text-fill-color: #ffffff !important;
            -webkit-box-shadow: 0 0 0px 1000px transparent inset !important;
            transition: background-color 5000s ease-in-out 0s;
        }

        .btn-signin {
            background-color: #282a2e;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            padding: 14px;
            font-weight: 700;
            font-size: 1rem;
            letter-spacing: 0.5px;
            width: 100%;
            cursor: pointer;
            margin-top: 10px;
        }

        .btn-signin:hover {
            background-color: #1a1b1e;
        }

        .blade-container {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            justify-content: flex-end;
            text-align: right;
            margin-right: 2%;
            margin-top: 60px;
            user-select: none;
        }

        .blade-text-sub {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.85);
            letter-spacing: 3px;
            text-transform: uppercase;
            font-weight: 600;
            line-height: 1.0;
            margin-bottom: 10px;
        }

        .blade-text-title {
            font-family: 'Montserrat', sans-serif;
            font-style: italic;
            font-weight: 900;
            font-size: 4.0rem;
            color: #ffffff;
            line-height: 1.0;
            letter-spacing: -1px;
            margin-bottom: 8px;
        }

        .blade-text-year {
            font-family: 'Bodoni Moda', serif;
            font-style: italic;
            font-weight: 700;
            font-size: 6.6rem;
            color: #ffffff;
            line-height: 0.85;
        }
    </style>
</head>
<body>

    <div class="cinema-viewport">
        
        <div id="result" class="result-box"></div>

        <div class="card-frame">
            <div class="logo-box">
                <span class="text-directors">Director's</span>
                <span class="text-club">Movie Club</span>
            </div>

            <div class="form-group">
                <input type="text" id="first_name" class="input-line" placeholder="First name" autocomplete="off">
                <input type="text" id="last_name" class="input-line" placeholder="Last name" autocomplete="off">
                <button type="button" class="btn-signin" py-click="verify_candidate">Sign in</button>
            </div>
        </div>

        <div class="blade-container">
            <div class="blade-text-sub">Denis Villeneuve</div>
            <div class="blade-text-title">Blade Runner</div>
            <div class="blade-text-year">2049</div>
        </div>

    </div>

    <script type="py" src="./main.py"></script>
</body>
</html>
